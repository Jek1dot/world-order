<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Order v0.4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">WORLD ORDER <small>v0.4</small></div>
    <div id="top-country" class="top-country"><span class="flag" id="top-flag">--</span><b id="top-country-name">Pilih negara di peta</b></div>
    <div class="top-date"><span id="date">1 Jan 2026</span></div>
    <div class="top-controls">
      <button id="btn-pause" class="icon-btn" title="Pause / Lanjut (Spasi)">⏸</button>
      <button class="speed-btn" data-speed="1">1×</button>
      <button class="speed-btn" data-speed="2">2×</button>
      <button class="speed-btn" data-speed="5">5×</button>
      <button class="speed-btn" data-speed="10">10×</button>
    </div>
    <div class="top-stats" id="top-stats">
      <span class="stat-chip" title="Kas negara (miliar USD)">💰 <b id="st-treasury">–</b></span>
      <span class="stat-chip" title="Manpower tersedia">👥 <b id="st-manpower">–</b></span>
      <span class="stat-chip" title="Stabilitas nasional">⚖ <b id="st-stability">–</b></span>
      <span class="stat-chip res" data-res="oil" title="Minyak">🛢 <b>–</b></span>
      <span class="stat-chip res" data-res="steel" title="Baja">⛓ <b>–</b></span>
      <span class="stat-chip res" data-res="aluminum" title="Aluminium">✈ <b>–</b></span>
      <span class="stat-chip res" data-res="coal" title="Batu bara">⚫ <b>–</b></span>
      <span class="stat-chip res" data-res="food" title="Pangan">🌾 <b>–</b></span>
    </div>
    <div class="top-actions">
      <button id="btn-save" class="small-btn">Simpan</button>
      <button id="btn-load" class="small-btn">Muat</button>
      <button id="btn-new" class="small-btn">Baru</button>
      <button id="btn-help" class="small-btn">?</button>
    </div>
  </header>

  <main id="main">
    <section id="map-area">
      <div id="map-toolbar">
        <div class="btn-group" id="mode-buttons">
          <button class="mode-btn active" data-mode="political" title="Warna menurut pemilik (owner)">Politik</button>
          <button class="mode-btn" data-mode="ownership" title="Pemilik; garis = bekas milik negara lain">Kepemilikan</button>
          <button class="mode-btn" data-mode="control" title="Warna menurut penguasa (controller)">Kontrol militer</button>
          <button class="mode-btn" data-mode="infra" title="Level infrastruktur">Infrastruktur</button>
          <button class="mode-btn" data-mode="resources" title="Produksi sumber daya">Sumber daya</button>
          <button class="mode-btn" data-mode="supply" title="Jaringan supply negaramu">Supply</button>
        </div>
        <div class="btn-group" id="res-buttons" hidden>
          <button class="res-btn active" data-r="steel">Baja</button>
          <button class="res-btn" data-r="oil">Minyak</button>
          <button class="res-btn" data-r="aluminum">Aluminium</button>
          <button class="res-btn" data-r="coal">Batu bara</button>
          <button class="res-btn" data-r="food">Pangan</button>
        </div>
        <div class="btn-group" id="zoom-buttons">
          <button class="zoom-btn" data-zoom="world" title="Dunia">🌍 Dunia</button>
          <button class="zoom-btn" data-zoom="indonesia">ID Indonesia</button>
          <button class="zoom-btn" data-zoom="java">📍 Pulau Jawa</button>
        </div>
      </div>
      <div id="map-wrap">
        <svg id="map" viewBox="0 0 1000 510" preserveAspectRatio="xMidYMid meet" aria-label="Peta dunia"></svg>
        <div id="map-tooltip"></div>
        <div id="order-hint" hidden></div>
        <div id="map-legend"></div>
        <div id="loading"><div><b>Memuat peta…</b><br><span id="loading-text">Mengunduh data provinsi</span></div></div>
      </div>
      <div id="toast-area"></div>
    </section>

    <aside id="side">
      <nav id="tabs">
        <button data-tab="country" class="active">Negara</button>
        <button data-tab="province">Provinsi</button>
        <button data-tab="military">Militer</button>
        <button data-tab="economy">Ekonomi</button>
        <button data-tab="build">Bangun</button>
        <button data-tab="production">Produksi</button>
        <button data-tab="diplomacy">Diplomasi</button>
        <button data-tab="war">Perang</button>
        <button data-tab="log">Log</button>
        <button data-tab="mission" id="tab-mission" hidden>Misi</button>
      </nav>
      <div id="panel"></div>
    </aside>
  </main>
  <div id="modal" hidden></div>
</div>

<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/diplomacy.js"></script>
<script src="js/pathfinding.js"></script>
<script src="js/supply.js"></script>
<script src="js/state.js"></script>
<script src="js/economy.js"></script>
<script src="js/military.js"></script>
<script src="js/country.js"></script>
<script src="js/war.js"></script>
<script src="js/ai.js"></script>
<script src="js/sim.js"></script>
<script src="js/save.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
<script src="js/panels.js"></script>
<script src="js/main.js"></script>
</body>
</html>
