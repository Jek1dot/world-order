<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Order v0.5α</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">WORLD ORDER<small>v0.5α</small></div>
    <div id="top-country" class="tb-country">
      <span class="flag" id="top-flag">--</span>
      <div class="tb-name"><b id="top-country-name">Pilih negara di peta</b><small id="top-leader"></small></div>
    </div>
    <div class="top-stats" id="top-stats">
      <span class="stat-chip" title="Kas negara (miliar USD)"><i data-ic="coins"></i><b id="st-treasury">–</b></span>
      <span class="stat-chip" title="Manpower tersedia"><i data-ic="soldier"></i><b id="st-manpower">–</b></span>
      <span class="stat-chip" title="Stabilitas nasional"><i data-ic="scale"></i><b id="st-stability">–</b></span>
      <span class="stat-chip" title="Pabrik sipil / militer"><i data-ic="factory"></i><b id="st-factories">–</b></span>
      <span class="stat-chip" title="Jumlah divisi"><i data-ic="shield"></i><b id="st-divisions">–</b></span>
      <span class="sep"></span>
      <span class="stat-chip res" data-res="oil" title="Minyak"><i data-ic="ore"></i><b>–</b></span>
      <span class="stat-chip res" data-res="steel" title="Baja"><i data-ic="gear"></i><b>–</b></span>
      <span class="stat-chip res" data-res="aluminum" title="Aluminium"><i data-ic="crate"></i><b>–</b></span>
      <span class="stat-chip res" data-res="coal" title="Batu bara"><i data-ic="factory"></i><b>–</b></span>
      <span class="stat-chip res" data-res="food" title="Pangan"><i data-ic="trade"></i><b>–</b></span>
    </div>
    <div id="alerts" class="alerts" aria-label="Notifikasi"></div>
    <div class="top-actions">
      <button id="btn-save" class="small-btn" title="Simpan">Simpan</button>
      <button id="btn-load" class="small-btn" title="Muat">Muat</button>
      <button id="btn-new" class="small-btn" title="Permainan baru">Baru</button>
      <button id="btn-help" class="small-btn" title="Bantuan">?</button>
    </div>
  </header>

  <main id="main">
    <nav id="tabs" aria-label="Panel negara"></nav>
    <section id="map-area">
      <div id="map-wrap">
        <svg id="map" viewBox="0 0 1000 510" preserveAspectRatio="xMidYMid meet" aria-label="Peta dunia"></svg>
        <div id="map-tooltip"></div>
        <div id="order-hint" hidden></div>
        <div id="map-legend"></div>
        <div id="loading"><div><b>Memuat peta…</b><br><span id="loading-text">Mengunduh data provinsi</span></div></div>
      </div>

      <div id="hud-modes" class="hud hud-bl">
        <div class="hud-title">Mode peta</div>
        <div class="btn-group" id="mode-buttons">
          <button class="mode-btn active" data-mode="political" title="Warna menurut pemilik (owner)">Politik</button>
          <button class="mode-btn" data-mode="ownership" title="Pemilik; garis = bekas milik negara lain">Kepemilikan</button>
          <button class="mode-btn" data-mode="control" title="Warna menurut penguasa (controller)">Kontrol</button>
          <button class="mode-btn" data-mode="infra" title="Level infrastruktur">Infra</button>
          <button class="mode-btn" data-mode="resources" title="Produksi sumber daya">Sumber daya</button>
          <button class="mode-btn" data-mode="supply" title="Jaringan supply negaramu">Supply</button>
        </div>
        <div class="btn-group" id="res-buttons" hidden>
          <button class="res-btn active" data-r="steel">Baja</button>
          <button class="res-btn" data-r="oil">Minyak</button>
          <button class="res-btn" data-r="aluminum">Aluminium</button>
          <button class="res-btn" data-r="coal">Batu bara</button>
          <button class="res-btn" data-r="food">Pangan</button>
        </div>
        <div class="btn-group" id="zoom-buttons">
          <button class="zoom-btn" data-zoom="world" title="Dunia">Dunia</button>
          <button class="zoom-btn" data-zoom="indonesia">Indonesia</button>
          <button class="zoom-btn" data-zoom="java">Pulau Jawa</button>
        </div>
      </div>

      <div id="hud-time" class="hud hud-br">
        <div class="date-box"><small>TANGGAL</small><span id="date">1 Jan 2026</span></div>
        <div class="btn-group time-ctl">
          <button id="btn-pause" class="icon-btn" title="Pause / Lanjut (Spasi)">⏸</button>
          <button class="speed-btn" data-speed="1" title="1 hari / detik">1</button>
          <button class="speed-btn" data-speed="2" title="2 hari / detik">2</button>
          <button class="speed-btn" data-speed="5" title="5 hari / detik">3</button>
          <button class="speed-btn" data-speed="10" title="10 hari / detik">4</button>
          <button class="speed-btn" data-speed="20" title="20 hari / detik">5</button>
        </div>
      </div>

      <div id="toast-area"></div>
      <div id="window" hidden>
        <div class="win-head"><span id="win-title">Panel</span><button id="win-close" class="win-x" title="Tutup (Esc)">✕</button></div>
        <div id="panel"></div>
      </div>
    </section>
  </main>
  <div id="modal" hidden></div>
</div>

<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/world.js"></script>
<script src="js/db.js"></script>
<script src="js/effects.js"></script>
<script src="js/diplomacy.js"></script>
<script src="js/pathfinding.js"></script>
<script src="js/supply.js"></script>
<script src="js/state.js"></script>
<script src="js/economy.js"></script>
<script src="js/military.js"></script>
<script src="js/country.js"></script>
<script src="js/focus.js"></script>
<script src="js/events.js"></script>
<script src="js/war.js"></script>
<script src="js/ai.js"></script>
<script src="js/sim.js"></script>
<script src="js/save.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
<script src="js/panels.js"></script>
<script src="js/panels2.js"></script>
<script src="js/main.js"></script>
</body>
</html>
